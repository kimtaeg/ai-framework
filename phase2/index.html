    <!-- Render Inspector: 컴포넌트 바깥에서 커밋 정보를 보여준다 (tools/inspector.js) -->
    <aside class="inspector card" id="inspector"></aside>
  </main>

  <!--
    서버(npm start, http://)로 열면 ES Module 원본(main.js)을,
    파일을 더블클릭해서(file://) 열면 모듈 import 가 브라우저 보안 정책으로 막히므로
    하나로 합친 bundle.js(node build.js 로 생성)를 불러온다. 둘 중 하나만 실행된다.
  -->
  <script>
    (function () {
      var s = document.createElement("script");
      if (location.protocol === "file:") {
        s.src = "./bundle.js";
      } else {
        s.type = "module";
        s.src = "./main.js";
      }
      document.body.appendChild(s);
    })();
  </script>
  <!-- chat:js --><script src="../tools/chat.js"></script>
</body>
