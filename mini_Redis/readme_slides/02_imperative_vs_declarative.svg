<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="명령형에서는 개발자가 세 단계로 실제 DOM을 직접 고치고, 선언형에서는 개발자가 상태와 화면의 모습만 쓰고 miniReact가 바뀐 곳을 찾아 반영한다">
  <style>
    text { font-family: Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
    .mono { font-family: Consolas, 'D2Coding', 'JetBrains Mono', monospace; }
    .flow { stroke-dasharray: 7 7; animation: dash 0.9s linear infinite; }
    .l1, .l2, .l3 { animation: lit3 6s ease-in-out infinite; }
    .l2 { animation-delay: 2s; } .l3 { animation-delay: 4s; }
    .r1, .r2, .r3, .r4 { animation: lit4 6s ease-in-out infinite; }
    .r2 { animation-delay: 1.5s; } .r3 { animation-delay: 3s; } .r4 { animation-delay: 4.5s; }
    @keyframes dash { from { stroke-dashoffset: 14; } to { stroke-dashoffset: 0; } }
    @keyframes lit3 { 0% { opacity: .4; } 5%, 30% { opacity: 1; } 36%, 100% { opacity: .4; } }
    @keyframes lit4 { 0% { opacity: .45; } 5%, 23% { opacity: 1; } 29%, 100% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
  </style>
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#60a5fa"/></marker>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#fb923c"/></marker>
  </defs>

  <rect x="0" y="0" width="1200" height="750" rx="24" fill="#0f172a"/>
  <rect x="20" y="20" width="560" height="662" rx="18" fill="#111c33" stroke="#334155"/>
  <rect x="620" y="20" width="560" height="662" rx="18" fill="#111c33" stroke="#334155"/>

  <text x="40" y="74" font-size="32" font-weight="800" fill="#f8fafc">명령형 (imperative)</text>
  <text x="40" y="112" font-size="20" fill="#cbd5e1">개발자가 화면을 바꾸는 절차를 지시합니다</text>

  <rect x="440" y="144" width="120" height="462" rx="12" fill="#1f2937" stroke="#94a3b8" stroke-width="2"/>
  <text x="500" y="368" font-size="22" font-weight="700" fill="#e2e8f0" text-anchor="middle">실제 DOM</text>
  <text class="mono" x="500" y="400" font-size="20" fill="#94a3b8" text-anchor="middle">&lt;input&gt;</text>

  <g class="l1">
    <rect x="40" y="144" width="370" height="134" rx="12" fill="#172f52" stroke="#60a5fa" stroke-width="2"/>
    <text x="58" y="190" font-size="20" font-weight="700" fill="#93c5fd">① 개발자가 요소를 만든다</text>
    <text class="mono" x="58" y="238" font-size="20" fill="#e2e8f0">document.createElement("input")</text>
    <line x1="410" y1="211" x2="432" y2="211" stroke="#60a5fa" stroke-width="3" marker-end="url(#ab)"/>
  </g>
  <g class="l2">
    <rect x="40" y="308" width="370" height="134" rx="12" fill="#172f52" stroke="#60a5fa" stroke-width="2"/>
    <text x="58" y="354" font-size="20" font-weight="700" fill="#93c5fd">② 개발자가 화면에 붙인다</text>
    <text class="mono" x="58" y="402" font-size="20" fill="#e2e8f0">main.appendChild(input)</text>
    <line x1="410" y1="375" x2="432" y2="375" stroke="#60a5fa" stroke-width="3" marker-end="url(#ab)"/>
  </g>
  <g class="l3">
    <rect x="40" y="472" width="370" height="134" rx="12" fill="#172f52" stroke="#60a5fa" stroke-width="2"/>
    <text x="58" y="518" font-size="20" font-weight="700" fill="#93c5fd">③ 개발자가 값을 직접 고친다</text>
    <text class="mono" x="58" y="566" font-size="20" fill="#e2e8f0">input.value = draft</text>
    <line x1="410" y1="539" x2="432" y2="539" stroke="#60a5fa" stroke-width="3" marker-end="url(#ab)"/>
  </g>
  <text x="300" y="652" font-size="20" fill="#cbd5e1" text-anchor="middle">어느 요소를 어떻게 바꿀지 개발자가 연결합니다</text>

  <text x="640" y="74" font-size="32" font-weight="800" fill="#f8fafc">선언형 (declarative)</text>
  <text x="640" y="112" font-size="20" fill="#cbd5e1">개발자가 상태에 맞는 화면의 모습을 설명합니다</text>

  <g class="r1">
    <rect x="640" y="144" width="520" height="88" rx="12" fill="#172f52" stroke="#60a5fa" stroke-width="2"/>
    <text x="658" y="178" font-size="20" font-weight="700" fill="#93c5fd">상태 (state)</text>
    <text class="mono" x="658" y="212" font-size="20" fill="#e2e8f0">const [draft, setDraft] = useState("")</text>
  </g>
  <line class="flow" x1="900" y1="232" x2="900" y2="254" stroke="#60a5fa" stroke-width="3" marker-end="url(#ab)"/>
  <g class="r2">
    <rect x="640" y="262" width="520" height="116" rx="12" fill="#172f52" stroke="#60a5fa" stroke-width="2"/>
    <text x="658" y="296" font-size="20" font-weight="700" fill="#93c5fd">화면의 모습 (가상 노드, VNode)</text>
    <text class="mono" x="658" y="330" font-size="20" fill="#e2e8f0">createElement("input", {</text>
    <text class="mono" x="682" y="358" font-size="20" fill="#e2e8f0">value: props.draft })</text>
  </g>
  <line class="flow" x1="900" y1="378" x2="900" y2="400" stroke="#fb923c" stroke-width="3" marker-end="url(#ao)"/>
  <g class="r3">
    <rect x="640" y="408" width="520" height="88" rx="12" fill="#3b2410" stroke="#fb923c" stroke-width="2"/>
    <text x="658" y="442" font-size="20" font-weight="700" fill="#fdba74">miniReact · 비교 (diff)</text>
    <text x="658" y="476" font-size="20" fill="#fff7ed">이전 모습과 새 모습을 비교해 바뀐 곳을 찾는다</text>
  </g>
  <line class="flow" x1="900" y1="496" x2="900" y2="518" stroke="#fb923c" stroke-width="3" marker-end="url(#ao)"/>
  <g class="r4">
    <rect x="640" y="526" width="520" height="80" rx="12" fill="#3b2410" stroke="#fb923c" stroke-width="2"/>
    <text x="658" y="558" font-size="20" font-weight="700" fill="#fdba74">miniReact · 반영</text>
    <text x="658" y="590" font-size="20" fill="#fff7ed">바뀐 곳만 실제 DOM에 반영한다</text>
  </g>
  <text x="900" y="652" font-size="20" fill="#cbd5e1" text-anchor="middle">개발자는 상태와 화면의 관계만 표현합니다</text>

  <rect x="340" y="704" width="20" height="20" rx="5" fill="#172f52" stroke="#60a5fa" stroke-width="2"/>
  <text x="370" y="721" font-size="20" fill="#bfdbfe">개발자가 작성하는 코드</text>
  <rect x="630" y="704" width="20" height="20" rx="5" fill="#3b2410" stroke="#fb923c" stroke-width="2"/>
  <text x="660" y="721" font-size="20" fill="#fed7aa">miniReact가 수행하는 일</text>
</svg>
